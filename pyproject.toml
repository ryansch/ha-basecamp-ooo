[project]
name = "ha-basecamp-ooo"
version = "0.1.1"
description = "Home Assistant integration that sets Basecamp out-of-office on the first day of time off"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]
